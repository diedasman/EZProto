name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            executable: EZProto
            archive: EZProto-linux-x64.tar.gz
          - platform: windows-x64
            os: windows-latest
            executable: EZProto.exe
            archive: EZProto-windows-x64.zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pyinstaller

      - name: Run tests
        run: pytest

      - name: Build executable
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            data_sep=";"
            icon_args=(--icon assets/icon.ico)
          else
            data_sep=":"
            icon_args=()
          fi

          python -m PyInstaller \
            --name EZProto \
            --onefile \
            --clean \
            --noconfirm \
            "${icon_args[@]}" \
            --collect-all textual \
            --collect-all textual_serve \
            --add-data "src/ezproto/app.tcss${data_sep}ezproto" \
            --add-data "src/ezproto/assets${data_sep}ezproto/assets" \
            src/ezproto/__main__.py

      - name: Stage release package
        run: |
          mkdir -p package/EZProto
          cp "dist/${{ matrix.executable }}" package/EZProto/
          cp README.md package/EZProto/
          cp assets/icon.png package/EZProto/
          cp assets/icon.ico package/EZProto/

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C package EZProto

      - name: Create Windows archive
        if: runner.os == 'Windows'
        run: 7z a "${{ matrix.archive }}" ./package/EZProto/*

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ezproto-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          target_commitish: main
          name: EZProto v${{ steps.version.outputs.version }} build ${{ github.run_number }}
          body: |
            Automated release from the main branch.

            Includes Linux and Windows standalone builds.
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
